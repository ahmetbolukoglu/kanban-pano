# AppNar Factory — builds this app with AI inside your own GitHub account.
# Runs when appnar/spec.json changes (AppNar pushes it) or on manual dispatch.
# AI: your own Gemini or Groq key, fetched from AppNar at run time with this
# workflow's OIDC token (nothing is stored here). An AI_API_KEY repository
# secret (plus optional AI_PROVIDER variable) overrides it.
name: AppNar Factory

on:
  push:
    branches: [main]
    paths: [appnar/spec.json]
  workflow_dispatch:

concurrency:
  group: appnar-factory
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Uygulamayı üret
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
    steps:
      - name: Hazırlık
        uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Git kimliği
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
      - name: Plan çıkarılıyor
        run: node appnar/generate.mjs plan
      - name: Mantık ve testler yazılıyor
        run: node appnar/generate.mjs logic
      - name: Arayüz tasarlanıyor
        run: node appnar/generate.mjs ui
      - name: Dokümantasyon yazılıyor
        run: node appnar/generate.mjs docs
      - name: Kalite kontrolü
        run: node appnar/generate.mjs verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Canlı demo yayınlanıyor
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
